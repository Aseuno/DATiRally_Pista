<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>DATi Rally Pista</title>

<script type="module"
src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
</script>

<style>

#viewer{
display:none;
width:100vw;
height:100vh;
}

#landing{
position:absolute;
top:0;
left:0;
width:100vw;
height:100vh;

display:flex;
flex-direction:column;
justify-content:center;
align-items:center;

background-image:url("fondo.webp");
background-size:clamp(120px, 25vw, 420px);
background-position:center;
background-repeat:repeat;
padding:5vh 5vw;
box-sizing:border-box;
}

#titulo-img{
width:clamp(220px, 70vw, 900px);
margin-bottom:clamp(20px, 5vh, 60px);
}

#start-ar{
padding:clamp(14px, 2vh, 22px) clamp(28px, 5vw, 60px);

font-size:clamp(16px, 2.8vw, 24px);

background:white;
border:none;
border-radius:16px;

box-shadow:0 6px 14px rgba(0,0,0,0.35);

cursor:pointer;
}

</style>

</head>

<body>

<div id="landing">

<img id="titulo-img" src="titulo.webp" alt="Descubre la siguiente pista">

<button id="start-ar">
Ver en AR
</button>

</div>

<model-viewer
id="viewer"
src="FiguritaQR.glb"
ar
ar-placement="floor"
ar-scale="fixed"
scale=".9 .9 .9"
shadow-intensity=".5"
camera-controls
interaction-prompt="auto"
touch-action="none">
</model-viewer>

<script>
const btn = document.getElementById("start-ar");
const viewer = document.getElementById("viewer");

btn.addEventListener("click", async () => {
document.getElementById("landing").style.display = "none";
viewer.style.display = "block";
await viewer.activateAR();
});
</script>

</body>

</html>

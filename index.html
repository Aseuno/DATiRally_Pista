<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>DATi Rally Pista</title>

<script type="module"
src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
</script>

<style>

#viewer{
display:none;
width:100vw;
height:100vh;
background:transparent;
}

#landing{
position:absolute;
top:0;
left:0;
width:100vw;
height:100vh;

display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
gap:2vh;

background-image:url("fondo.webp");
background-size:clamp(120px, 25vw, 420px);
background-position:center;
background-repeat:repeat;
padding:5vh 5vw;
box-sizing:border-box;
}

#titulo-img{
width:min(92vw, 900px);
max-height:45vh;
object-fit:contain;

margin-bottom:clamp(20px, 6vh, 60px);
}

#start-ar{
padding:clamp(16px, 2.5vh, 26px) clamp(32px, 6vw, 70px);

font-size:clamp(18px, 4vw, 26px);

background:white;
border:none;
border-radius:16px;

box-shadow:0 6px 14px rgba(0,0,0,0.35);

cursor:pointer;
}

</style>

</head>

<body>

<div id="landing">

<img id="titulo-img" src="titulo.webp" alt="Descubre la siguiente pista">

<button id="start-ar">
Ver en AR
</button>

</div>

<model-viewer
id="viewer"
src="FiguritaQR.glb"
ar
ar-placement="floor"
scale=".6 .6 .6"
shadow-intensity=".5"
camera-controls
interaction-prompt="auto"
touch-action="none">
</model-viewer>

<script>
const btn = document.getElementById("start-ar");
const viewer = document.getElementById("viewer");
const landing = document.getElementById("landing");

btn.addEventListener("click", async () => {
landing.style.display = "none";
viewer.style.display = "block";
await viewer.activateAR();
});

viewer.addEventListener("ar-status", (event) => {
if (event.detail.status === "not-presenting") {
viewer.style.display = "none";
landing.style.display = "flex";
}
});
</script>

</body>

</html>

<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>DATi Rally Pista</title>

<script type="module"
src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
</script>

<style>

#viewer{
display:none;
width:100vw;
height:100vh;
}

#landing{
position:absolute;
top:0;
left:0;
width:100vw;
height:100vh;

display:flex;
flex-direction:column;
justify-content:center;
align-items:center;

background-image:url("fondo.png");
background-size:512px;
background-position:center;
background-repeat:repeat;
}

#titulo-img{
width:clamp(260px,60vw,700px);
margin-bottom:40px;
}

#start-ar{
padding:20px 50px;
font-size:clamp(18px,2.5vw,24px);

background:white;
border:none;
border-radius:16px;

box-shadow:0 6px 14px rgba(0,0,0,0.35);

cursor:pointer;
}

</style>

</head>

<body>

<div id="landing">

<img id="titulo-img" src="titulo.png" alt="Descubre la siguiente pista">

<button id="start-ar">
Ver en AR
</button>

</div>

<model-viewer
id="viewer"
src="FiguritaQR.glb"
ar
ar-placement="floor"
scale=".9 .9 .9"
shadow-intensity=".5"
camera-controls
interaction-prompt="auto"
touch-action="none">
</model-viewer>

<script>
const btn = document.getElementById("start-ar");
const viewer = document.getElementById("viewer");

btn.addEventListener("click", async () => {
document.getElementById("landing").style.display = "none";
viewer.style.display = "block";
await viewer.activateAR();
});
</script>

</body>

</html>
